name: Build and test installable APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  android:
    name: Unit tests, lint, signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify project safety invariants
        run: python3 tools/verify_project.py

      - name: Run unit tests, lint and compile release
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Sign release APK with an ephemeral local key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/solorecord-install.jks" \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -keyalg RSA -keysize 3072 -validity 3650 \
            -alias solorecord -dname "CN=SoloRecord Private Installation" >/dev/null 2>&1
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk out/solorecord-aligned.apk
          "$TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/solorecord-install.jks" \
            --ks-key-alias solorecord \
            --ks-pass "pass:$PASSWORD" \
            --key-pass "pass:$PASSWORD" \
            --out out/SoloRecord-v1.0.0-release.apk out/solorecord-aligned.apk
          "$TOOLS/apksigner" verify --verbose --print-certs out/SoloRecord-v1.0.0-release.apk
          rm -f out/solorecord-aligned.apk

      - name: Upload APK (download under Actions → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: SoloRecord-installable-APK
          path: out/SoloRecord-v1.0.0-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
